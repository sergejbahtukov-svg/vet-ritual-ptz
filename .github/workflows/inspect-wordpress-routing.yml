name: Inspect WordPress public routing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect production routing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate deployment inputs
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          WP_DOMAIN: ${{ secrets.WP_DOMAIN }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_PORT DEPLOY_USER DEPLOY_PATH WP_DOMAIN DEPLOY_KNOWN_HOSTS; do
            [[ -n "${!name:-}" ]] || { echo "Required GitHub Secret is missing: ${name}" >&2; exit 1; }
          done
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]] || { echo "DEPLOY_PORT must be numeric" >&2; exit 1; }
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ && "$DEPLOY_PATH" != "/" && "$DEPLOY_PATH" != *".."* ]] || { echo "DEPLOY_PATH is unsafe" >&2; exit 1; }
          [[ "$WP_DOMAIN" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "WP_DOMAIN is invalid" >&2; exit 1; }

      - name: Configure verified SSH access
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ -n "$DEPLOY_SSH_KEY" ]] || { echo "DEPLOY_SSH_KEY secret is missing" >&2; exit 1; }
          eval "$(ssh-agent -s)"
          ssh-add <(printf "%s\n" "$DEPLOY_SSH_KEY")
          install -d -m 700 "$HOME/.ssh"
          printf "%s\n" "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"
          printf "SSH_AUTH_SOCK=%s\n" "$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          printf "SSH_AGENT_PID=%s\n" "$SSH_AGENT_PID" >> "$GITHUB_ENV"

      - name: Inspect WordPress and web-server routing
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          WP_DOMAIN: ${{ secrets.WP_DOMAIN }}
        run: |
          set -euo pipefail
          ssh -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "bash -s -- '${DEPLOY_PATH}' '${WP_DOMAIN}' '${DEPLOY_HOST}'" <<'REMOTE'
          set -u
          wp_root="$1"
          domain="$2"
          server_host="$3"

          echo '== WordPress installation =='
          test -f "$wp_root/wp-load.php"
          test -d "$wp_root/wp-content/themes"
          wp --path="$wp_root" core version
          wp --path="$wp_root" option get home
          wp --path="$wp_root" option get siteurl
          wp --path="$wp_root" option get stylesheet

          echo '== Domain response from this server =='
          response="$(curl --silent --show-error --location --max-time 30 --connect-to "${domain}:80:${server_host}:80" "http://${domain}/")"
          if printf '%s' "$response" | grep -q '/wp-content/'; then
            echo 'domain_html=wordpress'
          elif printf '%s' "$response" | grep -q '/wa-data/'; then
            echo 'domain_html=webasyst'
          else
            echo 'domain_html=unknown'
          fi

          echo '== Matching readable vhost directives =='
          found=0
          for config_root in /etc/nginx /etc/apache2 /etc/httpd; do
            test -d "$config_root" || continue
            while IFS= read -r config_file; do
              test -r "$config_file" || continue
              if grep -Eq "server_name[[:space:]].*${domain}|ServerName[[:space:]]+${domain}" "$config_file"; then
                echo "# ${config_file}"
                grep -E '^[[:space:]]*(server_name|root|proxy_pass|fastcgi_pass|ServerName|DocumentRoot)[[:space:]]' "$config_file" || true
                found=1
              fi
            done < <(grep -R -l --include='*.conf' -E "server_name[[:space:]].*${domain}|ServerName[[:space:]]+${domain}" "$config_root" 2>/dev/null || true)
          done
          test "$found" -eq 1 || echo 'No readable matching vhost configuration found for this SSH user.'
          REMOTE

      - name: Stop SSH agent
        if: always()
        run: |
          if [[ -n "${SSH_AGENT_PID:-}" ]]; then
            ssh-agent -k >/dev/null 2>&1 || true
          fi
